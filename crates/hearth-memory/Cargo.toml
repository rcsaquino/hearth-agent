[package]
name = "hearth-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
hearth-core = { path = "../hearth-core" }
hearth-model = { path = "../hearth-model" }
hearth-storage = { path = "../hearth-storage" }
hearth-tools = { path = "../hearth-tools" }
rusqlite = { version = "0.41.1", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
tempfile = "3"
