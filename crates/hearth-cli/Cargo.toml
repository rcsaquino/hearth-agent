[package]
name = "hearth-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "hearth"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hearth-eval = { path = "../hearth-eval" }
hearth-runtime = { path = "../hearth-runtime" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
hearth-core = { path = "../hearth-core" }
hearth-model = { path = "../hearth-model" }
hearth-memory = { path = "../hearth-memory" }

[lints]
workspace = true
