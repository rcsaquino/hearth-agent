[package]
name = "hearth-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "hearth"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
hearth-config = { path = "../hearth-config" }
hearth-model = { path = "../hearth-model" }
hearth-runtime = { path = "../hearth-runtime" }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde_json = "1"
time = { version = "0.3", features = ["local-offset"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
hearth-core = { path = "../hearth-core" }
hearth-model = { path = "../hearth-model" }
hearth-memory = { path = "../hearth-memory" }

[lints]
workspace = true
