name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format, lint, and test
        run: ./scripts/ci.sh
      - name: Secret scan
        env:
          PUBLIC_DENYLIST: ${{ secrets.HEARTH_PUBLIC_DENYLIST }}
        run: ./scripts/ci-secret-scan.sh
